name: release binaries

# Builds static musl binaries for amd64 and arm64.
# Runs on demand, and on every v* tag where it also attaches the tarballs to the release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release-binaries.yml'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # actions-rust-cross runs cargo inside the cross-rs image for the target,
      # so ring/musl C toolchains do not have to be installed on the runner.
      - name: Build
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --bin nexus-tui-client

      - name: Check the binary is static
        run: |
          file target/${{ matrix.target }}/release/nexus-tui-client
          file target/${{ matrix.target }}/release/nexus-tui-client | grep -q 'statically linked'

      - name: Smoke test (runs natively for x86_64 only; arm64 is checked via file/readelf)
        run: |
          set -eu
          binary="target/${{ matrix.target }}/release/nexus-tui-client"
          readelf -h "$binary" | grep -E 'Machine|Type'
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            "$binary" --version
            "$binary" --help >/dev/null
          fi

      - name: Package
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          name="nexus-tui-client-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/nexus-tui-client" "dist/${name}/"
          cp README.md "dist/${name}/"
          cp docs/MIGRATION.md "dist/${name}/"
          cp docs/protocol-bot.md "dist/${name}/"
          cp docs/protocol-web.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-tui-client-${{ matrix.arch }}-musl
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the release assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
